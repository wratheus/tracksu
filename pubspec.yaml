name: tracksu
description: Flutter project disgned for tracking and analyzing osu! statisics provided by osu! API

publish_to: 'none'

version: 1.2.0+6

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

workspace:
  - packages/*

dependencies:
  envied: ^1.3.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  tracksu_network: ^1.0.0
  tracksu_storage: ^1.0.0
  tracksu_ui: ^1.0.0
  http: ^1.6.0
  html: ^0.15.1
  url_launcher: ^6.3.2
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.0.0
  app_links: ^7.2.1
  flutter_widget_from_html: ^0.17.3
  intl: ^0.20.3
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.12.1
  envied_generator: ^1.3.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon_game_mods/
    - assets/icon_country_flags/
    - assets/utils/painted_logo.png
    - assets/utils/1024x500_banner.png

  fonts:
    - family: Exo 2
      fonts:
        - asset: assets/fonts/Exo2-VariableFont_wght.ttf
        - asset: assets/fonts/Exo2-Italic-VariableFont_wght.ttf
          style: italic
